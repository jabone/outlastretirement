# Backstop for the release gate. The real gate is `predeploy` in
# package.json, which npm runs before every `npm run deploy` on the machine
# that ships; this workflow catches anything pushed without deploying.
#
# Minutes: Actions on a private repository are metered (2,000 free a month
# on the Free plan, and the spending limit is kept at $0, so runs simply
# stop when they are used up), while the public repository's are not. So
# the browser job, the expensive one, runs on every push only in the public
# repository, where it gates each release; in the working repository it
# runs on main alone, since a branch is reviewed on its Vercel preview and
# the same commit is checked publicly before it ships. `check` runs
# everywhere.
name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  e2e:
    # Browser tests against the production build. Required, like `check`.
    if: github.repository == 'jabone/outlastretirement' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      # Safari's engine on a phone, the four flows only. Advisory until it
      # has been seen green on a release; then drop continue-on-error so a
      # WebKit-only regression blocks a release like any other.
      - run: npx playwright test --project=webkit-iphone
        env:
          E2E_WEBKIT: '1'
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # Public repository, main only: production is deployed from HERE, after
    # the three checks above pass on the exact commit, by the Vercel CLI
    # with a token (repository secrets VERCEL_TOKEN, VERCEL_ORG_ID,
    # VERCEL_PROJECT_ID). The Vercel project's own Git integration keeps
    # making branch previews from the working repository but its production
    # branch is set to a name that never exists, so nothing reaches
    # production without passing this workflow, and the site can never be
    # ahead of the published source: it IS the published source, built.
    # `vercel pull` fetches the project's production environment (the
    # module server origin) and `vercel build` builds with it, so the
    # upload is a prebuilt output and Vercel does not build again.
    if: github.repository == 'jabone/outlastretirement' && github.ref == 'refs/heads/main'
    needs: [check, e2e, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  provenance:
    # Public repository only: every commit in its history is authored AND
    # committed by the LLC (a squash or a rebase done under another identity
    # re-stamps the committer), and no image carries an embedded
    # provenance manifest. The identity that releases is in OPERATIONS.md
    # in the working repository.
    if: github.repository == 'jabone/outlastretirement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: One identity in the whole history
        run: |
          ids=$(git log --format='%an <%ae> / %cn <%ce>' | sort -u)
          echo "$ids"
          test "$ids" = "OutlastRetirement LLC <outlastretirement@gmail.com> / OutlastRetirement LLC <outlastretirement@gmail.com>"
      - name: No provenance manifest in any image
        run: |
          ! grep -rlaE 'c2pa|caBX|<x:xmpmeta' --include='*.png' --include='*.webp' --include='*.jpg' --include='*.ico' --include='*.svg' . --exclude-dir=node_modules --exclude-dir=.git
